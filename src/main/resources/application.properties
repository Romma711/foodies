spring.application.name=Foodies
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
logging.level.org.springframework.security=DEBUG
spring.servlet.multipart.max-file-size=10MB
# Registro de restaurante: hasta 5 fotos de 5 MB cada una
spring.servlet.multipart.max-request-size=30MB

# File storage for menus (carta PDFs): "local" (default, dev) or "r2" (Cloudflare R2)
storage.provider=${STORAGE_PROVIDER:local}
storage.local.dir=${STORAGE_LOCAL_DIR:uploads}
storage.local.public-base-url=/api/files
storage.r2.account-id=${R2_ACCOUNT_ID:}
storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
storage.r2.bucket=${R2_BUCKET:}
storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
